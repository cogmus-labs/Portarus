<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <linearGradient id="fill" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0.11"/>
    </linearGradient>
    <radialGradient id="gglow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#00ffa3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#00ffa3"/>
    </marker>
    <marker id="arrM" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a5a7a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="458" rx="20" fill="#0b1020" stroke="#1d2740" stroke-width="2"/>
  <rect x="300" y="1" width="640" height="458" fill="url(#gglow)"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#eef3fb">With Portarus</text>
  <text x="40" y="78" font-size="15" fill="#8b97b0">One clean, ready-to-use payload reaches your agent</text>

  <!-- sources -->
  <g font-size="15" font-weight="600">
    <g transform="translate(50 150)">
      <rect width="180" height="46" rx="10" fill="#111831" stroke="#2a3657" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="7" fill="#25D366"/>
      <text x="48" y="28" fill="#cdd6ea">WhatsApp</text>
    </g>
    <g transform="translate(50 214)">
      <rect width="180" height="46" rx="10" fill="#111831" stroke="#2a3657" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="7" fill="#2AABEE"/>
      <text x="48" y="28" fill="#cdd6ea">Telegram</text>
    </g>
    <g transform="translate(50 278)">
      <rect width="180" height="46" rx="10" fill="#111831" stroke="#2a3657" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="7" fill="#E01E5A"/>
      <text x="48" y="28" fill="#cdd6ea">Slack</text>
    </g>
  </g>

  <!-- converge into gateway -->
  <g fill="none" stroke="#4a5a7a" stroke-width="2" marker-end="url(#arrM)">
    <path d="M230 173 C 320 173, 360 210, 452 224"/>
    <path d="M230 237 L 452 237"/>
    <path d="M230 301 C 320 301, 360 264, 452 250"/>
  </g>

  <!-- Portarus gateway -->
  <g transform="translate(600 237)">
    <rect x="-66" y="-66" width="132" height="132" transform="rotate(45)" fill="none" stroke="url(#acc)" stroke-width="2"/>
    <rect x="-40" y="-40" width="80" height="80" transform="rotate(45)" fill="url(#fill)" stroke="url(#acc)" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-size="16" font-weight="700" fill="#eef3fb">PORTARUS</text>
    <text x="0" y="20" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6fe6c8">unify &#183; protect &#183; route</text>
  </g>

  <!-- clean single arrow out -->
  <path d="M700 237 L 884 237" fill="none" stroke="url(#acc)" stroke-width="3" marker-end="url(#arrG)"/>
  <g transform="translate(726 205)" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="-58" y="-17" width="116" height="30" rx="15" fill="#0e241e" stroke="#00ffa3" stroke-width="1.3"/>
    <text y="3" fill="#6fe6c8">clean payload</text>
  </g>

  <!-- healthy agent -->
  <g transform="translate(900 183)">
    <rect width="250" height="108" rx="14" fill="#0e241e" stroke="url(#acc)" stroke-width="2.5"/>
    <text x="125" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#d6fff0">YOUR AI AGENT</text>
    <text x="125" y="76" text-anchor="middle" font-size="14" fill="#6fe6c8">filtered &#183; unified &#183; audited</text>
  </g>
</svg>
