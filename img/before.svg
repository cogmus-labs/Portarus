<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5c6c"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
    <radialGradient id="dglow" cx="82%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff5c6c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff5c6c" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff7a6b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="458" rx="20" fill="#0b1020" stroke="#1d2740" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="458" rx="20" fill="url(#dglow)"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#eef3fb">Without Portarus</text>
  <text x="40" y="78" font-size="15" fill="#8b97b0">Raw payloads hit your agent directly</text>

  <!-- sources -->
  <g font-size="15" font-weight="600">
    <g transform="translate(60 150)">
      <rect width="190" height="46" rx="10" fill="#111831" stroke="#2a3657" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="7" fill="#25D366"/>
      <text x="48" y="28" fill="#cdd6ea">WhatsApp</text>
    </g>
    <g transform="translate(60 214)">
      <rect width="190" height="46" rx="10" fill="#111831" stroke="#2a3657" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="7" fill="#2AABEE"/>
      <text x="48" y="28" fill="#cdd6ea">Telegram</text>
    </g>
    <g transform="translate(60 278)">
      <rect width="190" height="46" rx="10" fill="#111831" stroke="#2a3657" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="7" fill="#E01E5A"/>
      <text x="48" y="28" fill="#cdd6ea">Slack</text>
    </g>
  </g>

  <!-- chaotic arrows straight to agent -->
  <g fill="none" stroke="#ff7a6b" stroke-width="2" opacity="0.85" marker-end="url(#arrR)">
    <path d="M260 173 C 480 173, 620 210, 870 225"/>
    <path d="M260 237 C 500 237, 640 237, 870 237"/>
    <path d="M260 301 C 480 301, 620 265, 870 249"/>
  </g>

  <!-- junk tags riding the stream -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <g transform="translate(430 150)"><rect x="-52" y="-18" width="104" height="30" rx="15" fill="#2a1420" stroke="#ff5c6c" stroke-width="1.3"/><text y="2" fill="#ff8a95">sliced x3</text></g>
    <g transform="translate(560 205)"><rect x="-50" y="-18" width="100" height="30" rx="15" fill="#2a1420" stroke="#ff5c6c" stroke-width="1.3"/><text y="2" fill="#ff8a95">duplicate</text></g>
    <g transform="translate(470 300)"><rect x="-44" y="-18" width="88" height="30" rx="15" fill="#2a2214" stroke="#ffb020" stroke-width="1.3"/><text y="2" fill="#ffcf7a">bot spam</text></g>
    <g transform="translate(640 315)"><rect x="-56" y="-18" width="112" height="30" rx="15" fill="#2a2214" stroke="#ffb020" stroke-width="1.3"/><text y="2" fill="#ffcf7a">token bomb</text></g>
  </g>

  <!-- overwhelmed agent -->
  <g transform="translate(880 176)">
    <rect width="250" height="108" rx="14" fill="#1a1020" stroke="url(#danger)" stroke-width="2.5"/>
    <text x="125" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#ffd0d0">YOUR AI AGENT</text>
    <text x="125" y="76" text-anchor="middle" font-size="14" fill="#ff9aa0">junk in &#183; junk out &#183; burned tokens</text>
  </g>
</svg>
