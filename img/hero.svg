<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <linearGradient id="fill" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0.11"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="20" fill="#0b1020" stroke="#1d2740" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#glow)"/>

  <!-- isotipo diamond -->
  <g transform="translate(600 104)">
    <rect x="-42" y="-42" width="84" height="84" transform="rotate(45)" fill="none" stroke="url(#acc)" stroke-width="2"/>
    <rect x="-22" y="-22" width="44" height="44" transform="rotate(45)" fill="url(#fill)" stroke="url(#acc)" stroke-width="2"/>
  </g>

  <text x="600" y="214" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="10" fill="#eef3fb">PORTARUS</text>
  <rect x="520" y="234" width="160" height="3" rx="1.5" fill="url(#acc)"/>
  <text x="600" y="272" text-anchor="middle" font-size="20" font-weight="400" letter-spacing="1" fill="#8b97b0">The signal layer between your message source and your AI agent</text>
</svg>
